name: Pages

# Publishes the develop branch to the GitHub Pages site root after every merge and on a manual
# run (Actions tab, "Run workflow", develop only). Pull request previews in pr-preview/ are kept.
on:
  workflow_dispatch:
  push:
    branches: [develop]

concurrency:
  group: pages-develop
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
